# Integración continua: en cada push o pull request, GitHub compila la app,
# ejecuta las pruebas y deja el APK de desarrollo (DEBUG) para descargar.
# En cada push a main publica además el APK de prueba como "pre-release" (canal de pruebas),
# para descargarlo desde el celular sin iniciar sesión. No usa secretos.
# La versión estable firmada llega en la Fase 9 (release.yml).
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # solo para crear la pre-release con el APK de prueba

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar APK de desarrollo
        run: ./gradlew assembleDebug --stacktrace

      - name: Ejecutar pruebas unitarias
        run: ./gradlew :core:model:test :core:domain:test testDebugUnitTest --stacktrace

      - name: Revisar el código con Lint
        run: ./gradlew lintDebug
        continue-on-error: true

      - name: Guardar el APK de desarrollo
        uses: actions/upload-artifact@v4
        with:
          name: finance-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Guardar reportes de pruebas y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14

      # Canal de pruebas: publica el APK DEBUG como pre-release v<versionName>-<versionCode>-dev.
      # Si ya existe esa versión, reemplaza el APK. Sube versionCode para crear una nueva.
      - name: Publicar APK de prueba (pre-release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${NAME}-${CODE}-dev"
          APK="finance-dev-${NAME}-${CODE}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" --prerelease \
              --title "Finance Dev $NAME ($CODE)" \
              --notes "APK de prueba (DEBUG) generado automáticamente desde ${GITHUB_SHA::7}. Se instala como «Finance Dev», aparte de la versión final."
          fi
