# Integración continua de Finance.
#
# En cada push o pull request: compila, ejecuta pruebas y revisa el código (lint).
# En cada push a main, además, publica un APK de prueba como "pre-release":
#   - Si existe el secreto SIGNING_KEY_PASSWORD: APK RELEASE firmado con la clave fija
#     (signing/finance-release.jks.enc). Se actualiza encima de la versión anterior sin
#     desinstalar y SIN perder datos. Tag: v<versionName>-<versionCode>-beta.
#   - Si no existe: APK DEBUG (firma temporal, puede pedir desinstalar). Tag: ...-dev.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # solo para crear la pre-release con el APK de prueba

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar APK de desarrollo
        run: ./gradlew assembleDebug --stacktrace

      - name: Ejecutar pruebas unitarias
        run: ./gradlew :core:model:test :core:domain:test testDebugUnitTest --stacktrace

      - name: Revisar el código con Lint
        run: ./gradlew lintDebug
        continue-on-error: true

      - name: Mostrar esquemas nuevos de la base de datos
        run: |
          # Room genera core/database/schemas/<clase>/<versión>.json. Deben guardarse en el
          # repositorio para probar migraciones; si hay alguno sin guardar, se muestra aquí.
          NEW=$(git status --porcelain --untracked-files=all core/database/schemas | awk '{print $2}')
          if [ -n "$NEW" ]; then
            echo "::warning::Hay esquemas de base de datos sin guardar en el repositorio"
            for f in $NEW; do echo "===== $f"; cat "$f"; echo; echo "===== FIN"; done
          fi

      - name: Preparar la clave de firma
        id: signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::warning::Falta el secreto SIGNING_KEY_PASSWORD: se publicará el APK DEBUG."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # La contraseña solo tiene letras y números: se quitan espacios o saltos de línea
          # que se cuelan al copiarla. Se muestra solo su longitud (debe ser 40), nunca el texto.
          PASS=$(printf '%s' "$SIGNING_KEY_PASSWORD" | tr -d '[:space:]')
          echo "::add-mask::$PASS"
          echo "Longitud de la contraseña recibida: ${#PASS} caracteres (se esperan 40)."
          KS="$RUNNER_TEMP/finance-release.jks"
          if ! PASS="$PASS" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in signing/finance-release.jks.enc -out "$KS" -pass env:PASS 2>/dev/null; then
            rm -f "$KS"
            echo "::error::La contraseña de SIGNING_KEY_PASSWORD no abre la clave. Cópiala de nuevo desde LEEME-RESPALDO.txt (solo los 40 caracteres)."
            exit 1
          fi
          {
            echo "FINANCE_KEYSTORE_PATH=$KS"
            echo "FINANCE_KEYSTORE_PASSWORD=$PASS"
            echo "FINANCE_KEY_ALIAS=finance"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Compilar APK firmado (RELEASE)
        if: steps.signing.outputs.signed == 'true'
        run: ./gradlew assembleRelease --stacktrace

      - name: Verificar la firma
        if: steps.signing.outputs.signed == 'true'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          # Huella del certificado autorizado (ver signing/README.md).
          grep -qi "SHA-256 digest: cd56e0e1d9367ce8b3f88a829a2d0f839311d5b0c2bcdc07616fbc33e90d7338" certs.txt \
            || { echo "::error::El APK no está firmado con el certificado autorizado"; exit 1; }

      - name: Borrar la clave de firma del servidor
        if: always() && steps.signing.outputs.signed == 'true'
        run: rm -f "$RUNNER_TEMP/finance-release.jks"

      - name: Guardar el APK de desarrollo
        uses: actions/upload-artifact@v4
        with:
          name: finance-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Guardar reportes de pruebas y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14

      - name: Publicar APK de prueba (pre-release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$SIGNED" = "true" ]; then
            TAG="v${NAME}-${CODE}-beta"
            APK="finance-${NAME}-${CODE}.apk"
            cp app/build/outputs/apk/release/app-release.apk "$APK"
            TITLE="Finance $NAME ($CODE) · prueba"
            NOTES="APK de prueba firmado con la clave fija de Finance (desde ${GITHUB_SHA::7}). Se instala encima de la versión anterior sin borrar tus datos."
          else
            TAG="v${NAME}-${CODE}-dev"
            APK="finance-dev-${NAME}-${CODE}.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$APK"
            TITLE="Finance Dev $NAME ($CODE)"
            NOTES="APK de desarrollo (DEBUG) desde ${GITHUB_SHA::7}. Firma temporal: puede pedir desinstalar la versión anterior."
          fi
          sha256sum "$APK" > "$APK.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" --prerelease --title "$TITLE" --notes "$NOTES"
          fi
